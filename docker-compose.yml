services:
  postgres:
    image: postgres:16-alpine
    container_name: tripare_bookings_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tripare_bookings
      POSTGRES_USER: booking_admin
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_admin -d tripare_bookings"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
